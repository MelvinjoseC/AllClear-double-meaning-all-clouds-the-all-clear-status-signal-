name: AllClear Multi-Cloud CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-ci:
    name: Backend CI & Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: Install dependencies
        run: |
          cd backend
          npm install

      - name: Build TypeScript
        run: |
          cd backend
          npm run build

      - name: Run Backend Test Suite
        run: |
          node tests/test_backend.js

  frontend-ci:
    name: Frontend CI & Vite Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        run: |
          cd frontend
          npm install

      - name: Build React SPA
        run: |
          cd frontend
          npm run build

  agent-ci:
    name: Agent Unit Tests & CLI Diagnostics
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Agent Unit Test Suite
        run: |
          python tests/test_agent.py

      - name: Verify CLI Diagnostic Flags
        run: |
          python agent/agent.py --version
          python agent/agent.py --dry-run

  helm-lint:
    name: Kubernetes Helm Chart Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Lint AllClear Helm Chart
        run: |
          helm lint infra/helm/allclear/

  docker-validation:
    name: Docker Configuration Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configurations
        run: |
          docker compose -f infra/docker-compose.yml config
          docker compose -f infra/docker-compose.yml -f infra/docker-compose.prod.yml config
