# ==============================================================================
# CLOUDMON HELM VALUES
# ==============================================================================

global:
  environment: production

# --- Backend API Deployment Configurations ---
backend:
  replicaCount: 2
  image:
    repository: ghcr.io/melvinjosec/cloudmon-backend
    tag: latest
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 5000
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  env:
    jwtSecret: "super_secret_jwt_key_k8s_change_me"

# --- Frontend Dashboard Deployment Configurations ---
frontend:
  replicaCount: 2
  image:
    repository: ghcr.io/melvinjosec/cloudmon-frontend
    tag: latest
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 80
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

# --- PostgreSQL StatefulSet Configurations ---
postgres:
  image: postgres:16-alpine
  service:
    port: 5432
  dbName: cloudmon
  user: cloudmon_user
  pass: cloudmon_db_pass_k8s_change_me
  persistence:
    size: 10Gi
  resources:
    limits:
      cpu: 1000m
      memory: 1024Mi
    requests:
      cpu: 250m
      memory: 256Mi

# --- Ingress Controller Route Configuration ---
ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false" # Set true if SSL is terminated at ingress
  hosts:
    - host: cloudmon.local
      paths:
        - path: /
          pathType: Prefix
        - path: /api
          pathType: Prefix
