apiVersion: v1
kind: Service
metadata:
  name: cloudmon-backend
  labels:
    app: cloudmon-backend
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: 5000
      protocol: TCP
      name: http
  selector:
    app: cloudmon-backend
