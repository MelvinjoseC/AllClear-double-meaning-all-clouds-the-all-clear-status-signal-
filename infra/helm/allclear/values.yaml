# ==============================================================================
# ALLCLEAR HELM VALUES
# ==============================================================================

global:
  environment: production

# --- Backend API Deployment Configurations ---
backend:
  replicaCount: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 75
    targetMemoryUtilizationPercentage: 80
  image:
    repository: ghcr.io/melvinjosec/allclear-backend
    tag: latest
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 5000
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  env:
    jwtSecret: "super_secret_jwt_key_k8s_change_me"

# --- Frontend Dashboard Deployment Configurations ---
frontend:
  replicaCount: 2
  image:
    repository: ghcr.io/melvinjosec/allclear-frontend
    tag: latest
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 80
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

# --- High Availability Pod Disruption Budgets ---
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# --- PostgreSQL StatefulSet Configurations ---
postgres:
  image: postgres:16-alpine
  service:
    port: 5432
  dbName: allclear
  user: allclear_user
  pass: allclear_db_pass_k8s_change_me
  persistence:
    size: 10Gi
  resources:
    limits:
      cpu: 1000m
      memory: 1024Mi
    requests:
      cpu: 250m
      memory: 256Mi

# --- Ingress Controller & Cert-Manager Route Configuration ---
ingress:
  enabled: true
  className: "nginx"
  clusterIssuer: "letsencrypt-prod"
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  hosts:
    - host: allclear.local
      paths:
        - path: /
          pathType: Prefix
        - path: /api
          pathType: Prefix
  tls:
    - secretName: allclear-tls-cert
      hosts:
        - allclear.local

# --- Prometheus Operator ServiceMonitor ---
serviceMonitor:
  enabled: false
  interval: 15s
  scrapeTimeout: 10s
  labels:
    release: prometheus

# --- Kubernetes Zero-Trust Network Policy ---
networkPolicy:
  enabled: false
